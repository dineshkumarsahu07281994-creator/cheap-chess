<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheapChess · free online chess</title>
  <meta name="description" content="Free online chess against a random opponent. No accounts, no ads, no server.">
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS: WebRTC data channels + the free public matchmaking broker (0.peerjs.com). -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <h1><span aria-hidden="true">♞</span> CheapChess</h1>
    <p class="tag">Free online chess. No accounts, no ads, no server.</p>
  </header>

  <main>
    <section id="lobby" class="panel">
      <label class="field">
        <span>Your name</span>
        <input id="name" maxlength="20" autocomplete="nickname" spellcheck="false">
      </label>
      <button id="play" class="primary" type="button">Play a random opponent</button>
      <p class="hint">10 minutes per side. You're paired with the next person who clicks Play.</p>
      <p id="lobby-error" class="error" role="alert" hidden></p>
    </section>

    <section id="searching" class="panel" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="search-status" role="status">Looking for an opponent…</p>
      <p id="search-time" class="hint"></p>
      <button id="cancel" type="button">Cancel</button>
    </section>

    <section id="game" hidden>
      <div class="layout">
        <div class="board-col">
          <div class="player">
            <span class="who"><span id="opp-dot" class="dot"></span><span id="opp-name"></span></span>
            <span id="opp-clock" class="clock"></span>
          </div>
          <div id="board" class="board"></div>
          <div class="player">
            <span class="who"><span id="me-dot" class="dot"></span><span id="me-name"></span></span>
            <span id="me-clock" class="clock"></span>
          </div>
        </div>

        <aside class="side">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div id="offer" class="offer" hidden>
            <span id="offer-text"></span>
            <span class="offer-buttons">
              <button id="offer-yes" type="button" class="primary">Accept</button>
              <button id="offer-no" type="button">Decline</button>
            </span>
          </div>
          <ol id="moves" class="moves" aria-label="Moves"></ol>
          <div class="actions">
            <button id="draw" type="button">Offer draw</button>
            <button id="resign" type="button">Resign</button>
            <button id="rematch" type="button" class="primary" hidden>Rematch</button>
            <button id="new-opp" type="button" hidden>New opponent</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="foot">
    Moves travel directly between the two browsers (WebRTC). Matchmaking uses the free public PeerJS broker.
  </footer>
</body>
</html>
